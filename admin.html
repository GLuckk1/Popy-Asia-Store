// KOMPRESI FOTO PRODUK OTOMATIS
async function kompresFotoProduk(file) {
    const gambar = await createImageBitmap(file);

    const ukuranMaksimal = 1200;

    const skala = Math.min(
        1,
        ukuranMaksimal / Math.max(gambar.width, gambar.height)
    );

    const canvas = document.createElement("canvas");

    canvas.width = Math.round(gambar.width * skala);
    canvas.height = Math.round(gambar.height * skala);

    const context = canvas.getContext("2d");

    context.drawImage(
        gambar,
        0,
        0,
        canvas.width,
        canvas.height
    );

    gambar.close();

    // Coba WebP terlebih dahulu
    let blob = await new Promise(resolve => {
        canvas.toBlob(resolve, "image/webp", 0.82);
    });

    // Jika WebP tidak didukung, gunakan JPEG
    if (!blob || blob.type !== "image/webp") {
        blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.82);
        });
    }

    if (!blob) {
        throw new Error("Gagal mengompres foto.");
    }

    // Turunkan kualitas jika ukuran masih lebih dari 300 KB
    const format = blob.type;

    for (const kualitas of [0.72, 0.62, 0.52]) {
        if (blob.size <= 300 * 1024) break;

        blob = await new Promise(resolve => {
            canvas.toBlob(resolve, format, kualitas);
        });

        if (!blob) {
            throw new Error("Gagal mengompres foto.");
        }
    }

    const ekstensi = blob.type === "image/webp"
        ? "webp"
        : "jpg";

    const fotoBaru = new File(
        [blob],
        `produk-${Date.now()}.${ekstensi}`,
        { type: blob.type }
    );

    console.log("Ukuran foto asli:", file.size);
    console.log("Ukuran foto setelah kompresi:", fotoBaru.size);

    return fotoBaru;
}

async function simpanProdukAdmin(event) {
    event.preventDefault();

    const form = document.querySelector("#form-produk-admin");
    const pesan = document.querySelector("#pesan-produk-admin");
    const tombol = form.querySelector('button[type="submit"]');

    const nama = document.querySelector("#nama-produk-admin").value.trim();
    const kategori = document.querySelector("#kategori-produk-admin").value;
    const harga = Number(document.querySelector("#harga-produk-admin").value);
    const hargaLamaInput = document.querySelector("#harga-lama-admin").value;
    const hargaPromoInput = document.querySelector("#harga-promo-admin").value;
    const deskripsi = document.querySelector("#deskripsi-produk-admin").value.trim();
    const fileFoto = document.querySelector("#gambar-produk-admin").files[0];
    const stok = Number(document.querySelector("#stok-produk-admin").value);
    const aktif = document.querySelector("#aktif-produk-admin").checked;

    const hargaLama = hargaLamaInput === "" ? null : Number(hargaLamaInput);
    const hargaPromo = hargaPromoInput === "" ? null : Number(hargaPromoInput);

    if (!nama || !kategori || !fileFoto || harga < 0 || stok < 0) {
        pesan.textContent = "Lengkapi data produk dan pilih foto.";
        return;
    }

    if (!fileFoto.type.startsWith("image/")) {
        pesan.textContent = "File harus berupa gambar.";
        return;
    }

    if (fileFoto.size > 5 * 1024 * 1024) {
        pesan.textContent = "Ukuran foto asli maksimal 5 MB.";
        return;
    }

    if (hargaPromo !== null && hargaPromo >= harga) {
        pesan.textContent = "Harga promo harus lebih rendah dari harga normal.";
        return;
    }

    const hargaAcuan = hargaLama !== null && hargaLama > 0
        ? hargaLama
        : harga;

    const promoPersen = hargaPromo !== null && hargaAcuan > hargaPromo
        ? Math.round((hargaAcuan - hargaPromo) / hargaAcuan * 100)
        : 0;

    try {
        tombol.disabled = true;

        // KOMPRESI FOTO
        pesan.textContent = "Sedang mengompres foto...";

        const fotoKompres = await kompresFotoProduk(fileFoto);

        const ukuranKB = (fotoKompres.size / 1024).toFixed(0);

        pesan.textContent = `Foto berhasil dikompres (${ukuranKB} KB). Sedang mengunggah...`;

        // UPLOAD FOTO KE SUPABASE
        const ekstensi = fotoKompres.type === "image/webp"
            ? "webp"
            : "jpg";

        const namaFile = `${crypto.randomUUID()}.${ekstensi}`;

        const { data: hasilUpload, error: errorUpload } = await supabaseClient
            .storage
            .from("produk")
            .upload(namaFile, fotoKompres, {
                cacheControl: "3600",
                upsert: false,
                contentType: fotoKompres.type
            });

        if (errorUpload) {
            console.error("Gagal upload foto:", errorUpload);
            pesan.textContent = "Upload foto gagal. Periksa izin Storage.";
            return;
        }

        // AMBIL URL FOTO
        const { data: urlFoto } = supabaseClient
            .storage
            .from("produk")
            .getPublicUrl(hasilUpload.path);

        pesan.textContent = "Foto berhasil diunggah. Menyimpan produk...";

        // SIMPAN DATA PRODUK
        const { error } = await supabaseClient
            .from("produk")
            .insert([{
                nama_produk: nama,
                kategori: kategori,
                harga: harga,
                harga_lama: hargaLama,
                harga_promo: hargaPromo,
                promo_persen: promoPersen,
                deskripsi: deskripsi,
                gambar_url: urlFoto.publicUrl,
                stok: stok,
                aktif: aktif
            }]);

        if (error) {
            console.error("Gagal menyimpan produk:", error);
            pesan.textContent = "Foto sudah diunggah, tetapi data produk gagal disimpan. Periksa izin database.";
            return;
        }

        pesan.textContent = `Produk berhasil disimpan! Ukuran foto: ${ukuranKB} KB.`;

        form.reset();

        document.querySelector("#stok-produk-admin").value = "0";
        document.querySelector("#aktif-produk-admin").checked = true;

        muatDaftarProdukAdmin();

    } catch (error) {
        console.error("Kesalahan menyimpan produk:", error);
        pesan.textContent = "Terjadi kesalahan saat memproses foto. Silakan coba lagi.";

    } finally {
        tombol.disabled = false;
    }
}
    
async function muatDaftarProdukAdmin() {
    const daftar = document.querySelector("#daftar-produk-admin");
    if (!daftar) return;

    daftar.textContent = "Memuat daftar produk...";

    const { data: produk, error } = await supabaseClient
        .from("produk")
        .select("id, nama_produk, kategori, harga, harga_lama, harga_promo, stok, aktif, gambar_url")
        .order("id", { ascending: false });

    if (error) {
        console.error("Gagal memuat produk:", error);
        daftar.textContent = "Gagal memuat produk. Periksa izin SELECT.";
        return;
    }

    if (!produk || produk.length === 0) {
        daftar.textContent = "Belum ada produk.";
        return;
    }

    daftar.innerHTML = produk.map(item => `
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #ddd;">
            <img
                src="${escapeHTML(item.gambar_url || "")}"
                alt="${escapeHTML(item.nama_produk || "Produk")}"
                style="width:65px;height:65px;object-fit:cover;border-radius:8px;"
            >
            <div style="flex:1;min-width:150px;">
                <strong>${escapeHTML(item.nama_produk || "")}</strong>
                <div>Harga: ¥${Number(item.harga || 0).toLocaleString("ja-JP")}</div>
                <div>Stok: ${Number(item.stok || 0)}</div>
                <div>Status: ${item.aktif ? "Aktif" : "Nonaktif"}</div>
                <div>Kategori: ${escapeHTML(item.kategori || "Belum ada kategori")}</div>
            </div>
            <button type="button" class="btn"
                onclick="editProdukAdmin(${Number(item.id)})">✏️ Edit</button>
            <button type="button" class="btn"
                onclick="hapusProdukAdmin(${Number(item.id)})">🗑️ Hapus</button>
        </div>
    `).join("");
}

    // Muat kategori dari Supabase untuk dropdown edit produk.

        .from("kategori_produk")
        .select("nama_kategori, nilai_kategori")
        .order("nama_kategori", { ascending: true });

    if (errorKategori) {
        console.error("Gagal memuat kategori:", errorKategori);
        dropdownKategori.innerHTML =
            '<option value="">Gagal memuat kategori</option>';
    } else {
        dropdownKategori.innerHTML = "";

            opsi.value = item.nilai_kategori;
            opsi.textContent = item.nama_kategori;

            dropdownKategori.appendChild(opsi);
        });

        // Pilih kategori yang saat ini digunakan oleh produk.
        dropdownKategori.value = produk.kategori || "";

        // Jika kategori lama tidak ditemukan, tampilkan sebagai pilihan.
        if (
            produk.kategori &&
            dropdownKategori.value !== produk.kategori
        ) {

            opsiLama.value = produk.kategori;
            opsiLama.textContent = produk.kategori;
            opsiLama.selected = true;

            dropdownKategori.appendChild(opsiLama);
        }

    // Pilihan foto dilakukan langsung oleh pengguna.
    document
        .getElementById("edit-foto-produk")
        .addEventListener("change", function () {

        .getElementById("form-simpan-edit-produk")

        .getElementById("tombol-batal-edit")

            dataEditProdukAktif = null;
        });

    formEdit.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


// Menyimpan perubahan produk
async function simpanPerubahanProdukAdmin(event) {
    event.preventDefault();

    const produkLama = dataEditProdukAktif;

    if (!produkLama) {
        alert("Data produk tidak ditemukan. Silakan buka form edit kembali.");
        return;
    }

    const pesan = document.getElementById("edit-pesan-produk");
    const tombol = document.getElementById("tombol-simpan-edit");

    const nama = document.getElementById("edit-nama-produk").value.trim();
    const kategori = document.getElementById("edit-kategori-produk").value.trim();

    const hargaInput = document.getElementById("edit-harga-produk").value;
    const hargaLamaInput = document.getElementById("edit-harga-lama").value.trim();
    const hargaPromoInput = document.getElementById("edit-harga-promo").value.trim();
    const deskripsi = document.getElementById("edit-deskripsi-produk").value.trim();
    const stokInput = document.getElementById("edit-stok-produk").value;
    const aktif = document.getElementById("edit-aktif-produk").checked;

    const harga = Number(hargaInput);
    const hargaLama = hargaLamaInput === "" ? null : Number(hargaLamaInput);
    const hargaPromo = hargaPromoInput === "" ? null : Number(hargaPromoInput);
    const stok = Number(stokInput);

    if (
        !nama ||
        !kategori ||
        hargaInput.trim() === "" ||
        !Number.isFinite(harga) ||
        harga < 0 ||
        (hargaLama !== null &&
            (!Number.isFinite(hargaLama) || hargaLama < 0)) ||
        (hargaPromo !== null &&
            (!Number.isFinite(hargaPromo) ||
                hargaPromo < 0 ||
                hargaPromo >= harga)) ||
        stokInput.trim() === "" ||
        !Number.isInteger(stok) ||
        stok < 0
    ) {
        alert("Periksa kembali nama, kategori, harga, harga promo, dan stok.");
        return;
    }

    if (fotoEditProdukBaru) {
        if (!fotoEditProdukBaru.type.startsWith("image/")) {
            alert("File yang dipilih harus berupa gambar.");
            return;
        }

        if (fotoEditProdukBaru.size > 5 * 1024 * 1024) {
            alert("Ukuran foto maksimal 5 MB.");
            return;
        }
    }

    tombol.disabled = true;
    pesan.textContent = "Sedang menyimpan perubahan...";

    let pathFotoBaru = null;
    let urlFoto = produkLama.gambar_url || null;
    let pathFotoLama = null;

    try {
        // Upload foto baru jika pengguna memilihnya.
        if (fotoEditProdukBaru) {
            const ekstensi = fotoEditProdukBaru.name.includes(".")
                ? fotoEditProdukBaru.name.split(".").pop().toLowerCase()
                : "jpg";

            const namaFile = `${crypto.randomUUID()}.${ekstensi}`;

            const { data: hasilUpload, error: errorUpload } =
                await supabaseClient
                    .storage
                    .from("produk")
                    .upload(namaFile, fotoEditProdukBaru, {
                        cacheControl: "3600",
                        upsert: false
                    });

            if (errorUpload) {
                throw new Error("Upload foto gagal: " + errorUpload.message);
            }

            pathFotoBaru = hasilUpload.path;

            const { data: hasilURL } = supabaseClient
                .storage
                .from("produk")
                .getPublicUrl(pathFotoBaru);

            urlFoto = hasilURL.publicUrl;
        }

        const hargaAcuan = hargaLama !== null && hargaLama > 0
            ? hargaLama
            : harga;

        const promoPersen = hargaPromo !== null && hargaAcuan > hargaPromo
            ? Math.round(((hargaAcuan - hargaPromo) / hargaAcuan) * 100)
            : 0;

        const { error: errorUpdate } = await supabaseClient
            .from("produk")
            .update({
                nama_produk: nama,
                kategori: kategori,
                harga: harga,
                harga_lama: hargaLama,
                harga_promo: hargaPromo,
                promo_persen: promoPersen,
                deskripsi: deskripsi,
                stok: stok,
                aktif: aktif,
                gambar_url: urlFoto
            })
            .eq("id", produkLama.id);

        if (errorUpdate) {
            throw new Error("Gagal menyimpan ke database: " + errorUpdate.message);
        }

        // Hapus foto lama hanya setelah database berhasil diperbarui.
        if (pathFotoBaru && produkLama.gambar_url) {
            try {
                const urlLama = new URL(produkLama.gambar_url);
                const bagianPath = "/storage/v1/object/public/produk/";

                if (urlLama.pathname.includes(bagianPath)) {
                    pathFotoLama = decodeURIComponent(
                        urlLama.pathname.split(bagianPath)[1]
                    );
                }
            } catch (e) {
                console.warn("URL foto lama tidak dapat diperiksa.");
            }

            if (pathFotoLama && pathFotoLama !== pathFotoBaru) {
                const { error: errorHapus } = await supabaseClient
                    .storage
                    .from("produk")
                    .remove([pathFotoLama]);

                if (errorHapus) {
                    console.warn("Foto lama belum terhapus:", errorHapus);
                }
            }
        }

        alert("Produk berhasil diperbarui!");

        document.getElementById("form-edit-produk-admin").style.display = "none";
        document.getElementById("form-edit-produk-admin").innerHTML = "";

        fotoEditProdukBaru = null;
        dataEditProdukAktif = null;

        await muatDaftarProdukAdmin();

    } catch (error) {
        console.error(error);

        // Jika update database gagal, bersihkan foto baru yang belum digunakan.
        if (pathFotoBaru) {
            const { error: errorHapusBaru } = await supabaseClient
                .storage
                .from("produk")
                .remove([pathFotoBaru]);

            if (errorHapusBaru) {
                console.warn("Foto baru belum terhapus:", errorHapusBaru);
            }
        }

        pesan.textContent = error.message || "Terjadi kesalahan.";
        alert(error.message || "Gagal memperbarui produk.");

    } finally {
        const tombolAkhir = document.getElementById("tombol-simpan-edit");

        if (tombolAkhir) {
            tombolAkhir.disabled = false;
        }
    }
}
    
async function hapusProdukAdmin(id) {
    const yakin = confirm(
        "Yakin ingin menghapus produk ini? Tindakan ini tidak bisa dibatalkan."
    );

    if (!yakin) return;

    const { error } = await supabaseClient
        .from("produk")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Gagal menghapus produk:", error);
        alert("Gagal menghapus produk. Periksa izin Supabase.");
        return;
    }

    alert("Produk berhasil dihapus!");

    await muatDaftarProdukAdmin();
}

    async function muatDashboardAdmin() {
    const pesan = document.querySelector("#pesan-dashboard");

    try {
        // 1. Ambil data pesanan
        const { data: pesanan, error: errorPesanan } =
            await supabaseClient
                .from("pesanan")
                .select("nomor_pesanan, total, status, created_at")
                .order("created_at", { ascending: false });

        if (errorPesanan) throw errorPesanan;

        const daftarPesanan = pesanan || [];

        // 2. Hitung statistik berdasarkan status
        const statusNormal = status =>
            String(status || "").trim().toLowerCase();

        const jumlahBaru = daftarPesanan.filter(p =>
    ["baru", "pesanan baru", "menunggu", "pending"]
        .includes(statusNormal(p.status))
).length;

        const jumlahProses = daftarPesanan.filter(p =>
            statusNormal(p.status) === "diproses"
        ).length;

        const jumlahSelesai = daftarPesanan.filter(p =>
            statusNormal(p.status) === "selesai"
        ).length;

        // Total penjualan dihitung dari pesanan selesai
        const totalPenjualan = daftarPesanan
            .filter(p => statusNormal(p.status) === "selesai")
            .reduce((total, p) => total + Number(p.total || 0), 0);

        document.querySelector("#stat-pesanan-baru").textContent = jumlahBaru;
        document.querySelector("#stat-pesanan-proses").textContent = jumlahProses;
        document.querySelector("#stat-pesanan-selesai").textContent = jumlahSelesai;

            await supabaseClient
                .from("produk")
                .select("stok, aktif, harga_promo");

                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Tanggal</th>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Waktu</th>
                                <th style="padding:10px;text-align:right;border-bottom:1px solid #ddd;">Total</th>
                                <th style="padding:10px;text-align:left;border-bottom:1px solid #ddd;">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${limaTerbaru.map(p => `
                                <tr>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${escapeHTML(p.nomor_pesanan || "-")}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${p.created_at
                                            ? new Date(p.created_at).toLocaleDateString("id-ID")
                                            : "-"}
                                    </td>
                                    <td style="padding:10px;border-bottom:1px solid #eee;">
                                        ${p.created_at
                                            ? new Date(p.created_at).toLocaleTimeString("ja-JP", {
                                            hour: "2-digit",
                                            minute: "2-digit",
                                            hour12: false,
                                            timeZone: "Asia/Tokyo"

                                    </td>

                                        ¥${Number(p.total || 0).toLocaleString("ja-JP")}

                                        ${escapeHTML(p.status || "-")}
                                    </td>

        if (pesan) pesan.textContent = "";

    } catch (error) {
        console.error("Gagal memuat dashboard:", error);

        if (pesan) {
            pesan.textContent =

async function simpanStatusPesananAdmin(tombol, nomorPesanan) {
    const baris = tombol.closest("tr");
    const pilihan = baris?.querySelector(".pilihan-status-admin");

    if (!pilihan || !nomorPesanan) {
        alert("Pilihan status atau nomor pesanan tidak ditemukan.");
        return;
    }

    const statusBaru = pilihan.value;
    const statusLama = pilihan.dataset.statusLama || pilihan.value;

    if (!confirm(
        `Ubah status pesanan ${nomorPesanan} menjadi "${statusBaru}"?`
    )) {
        pilihan.value = statusLama;
        return;
    }

    tombol.disabled = true;
    tombol.textContent = "Menyimpan...";

    const { data, error } = await supabaseClient
        .from("pesanan")
        .update({ status: statusBaru })
        .eq("nomor_pesanan", nomorPesanan)
        .select("nomor_pesanan, status");

    tombol.disabled = false;
    tombol.textContent = "Simpan";

    if (error) {
        alert("Gagal menyimpan status: " + error.message);
        return;
    }

    if (!data || data.length === 0) {
        alert(
            "Status belum berubah. Pesanan tidak ditemukan atau akses database ditolak."
        );
        return;
    }

    alert(`Status pesanan ${nomorPesanan} berhasil diubah menjadi ${statusBaru}.`);

    muatPesananAdmin();
}

function escapeHTML(nilai) {
    return String(nilai).replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

            <h3>Daftar Produk</h3>
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="text-align:left;padding:8px;border-bottom:1px solid #ccc;">Produk</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Harga</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Jumlah</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(produk || []).map(item => `
                            <tr>
                                <td style="padding:8px;border-bottom:1px solid #eee;">${aman(item.nama_produk)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.harga)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${Number(item.jumlah || 0)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.subtotal)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <p style="text-align:right;">Subtotal: ${uang(pesanan.subtotal)}</p>
            <p style="text-align:right;">Ongkir: ${uang(pesanan.ongkir)}</p>
            <h3 style="text-align:right;">Total: ${uang(pesanan.total)}</h3>
        </div>

        <button type="button" class="btn" onclick="cetakNotaPesanan()">
            🖨️ Cetak / Simpan PDF
        </button>
    `;
}

function cetakNotaPesanan() {
    const nota = document.querySelector("#nota-pesanan");

    if (!nota) {
        alert("Nota belum tersedia.");
        return;
    }

    const jendela = window.open("", "_blank");

    if (!jendela) {
        alert("Pop-up diblokir browser. Izinkan pop-up untuk mencetak nota.");
        return;
    }

    jendela.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
            <meta charset="UTF-8">
            <title>Nota Pesanan</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 24px; }
                table { border-collapse: collapse; }
                @media print {
                    body { margin: 0; }
                    button { display: none; }
                }
            </style>
        </head>
        <body>${nota.outerHTML}</body>
        </html>
    `);

    jendela.document.close();
    jendela.focus();
    jendela.print();
}

async function simpanStatusPesanan(nomorPesanan) {
    const pilihan = document.querySelector("#status-pesanan-baru");
    const pesan = document.querySelector("#pesan-status-pesanan");

    if (!pilihan || !pesan) return;

    const statusBaru = pilihan.value;
    pesan.textContent = "Menyimpan status...";

    const { data: pesanan, error: errorCari } = await supabaseClient
        .from("pesanan")
        .select("id")
        .eq("nomor_pesanan", nomorPesanan)
        .single();

    if (errorCari || !pesanan) {
        pesan.textContent = "Gagal menemukan pesanan.";
        return;
    }

    const { error } = await supabaseClient
        .from("pesanan")
        .update({ status: statusBaru })
        .eq("id", pesanan.id);

    if (error) {
        pesan.textContent = "Gagal menyimpan status: " + error.message;
        return;
    }

    pesan.textContent = "Status berhasil disimpan!";

    await lihatDetailPesanan(nomorPesanan);
}

    async function muatKategoriAdmin() {
    const selectKategori = document.getElementById("kategori-produk-admin");

    if (!selectKategori) return;

    const { data, error } = await supabaseClient
        .from("kategori_produk")
        .select("nama_kategori, nilai_kategori")
        .order("nama_kategori", { ascending: true });

    if (error) {
        console.error("Gagal memuat kategori:", error);
        selectKategori.innerHTML =
            '<option value="">Gagal memuat kategori</option>';
        return;
    }

    selectKategori.innerHTML =
        '<option value="">Pilih kategori</option>';

    data.forEach(function(kategori) {
        const option = document.createElement("option");

        option.value = kategori.nilai_kategori;
        option.textContent = kategori.nama_kategori;

        selectKategori.appendChild(option);
    });
}

    
async function muatDaftarKategoriAdmin() {
    const area = document.getElementById("daftar-kategori-admin");

    if (!area) return;

    area.textContent = "Memuat kategori...";

    const { data, error } = await supabaseClient
        .from("kategori_produk")
        .select("id, nama_kategori, nilai_kategori")
        .order("nama_kategori", { ascending: true });

    if (error) {
        console.error("Gagal memuat daftar kategori:", error);
        area.textContent = "Gagal memuat kategori.";
        return;
    }

    if (!data || data.length === 0) {
        area.textContent = "Belum ada kategori.";
        return;
    }

    const daftar = document.createElement("div");

    data.forEach(function(kategori) {
        const baris = document.createElement("div");

        baris.style.cssText =
            "padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;";

        const nama = document.createElement("strong");
        nama.textContent = kategori.nama_kategori;

        const nilai = document.createElement("div");
        nilai.textContent = "Nilai: " + kategori.nilai_kategori;
        nilai.style.cssText =
            "font-size:13px;color:#666;margin-top:4px;";

        const tombolEdit = document.createElement("button");
        tombolEdit.type = "button";
        tombolEdit.textContent = "✏️ Edit";
        tombolEdit.style.cssText =
            "margin-top:8px;padding:6px 12px;cursor:pointer;";

                const tombolHapus = document.createElement("button");
        tombolHapus.type = "button";
        tombolHapus.textContent = "🗑️ Hapus";
        tombolHapus.style.cssText =
            "margin-top:8px;margin-left:8px;padding:6px 12px;cursor:pointer;background:#dc2626;color:white;border:none;border-radius:4px;";

        tombolHapus.addEventListener("click", async function() {
            const konfirmasi = confirm(
                "Apakah kamu yakin ingin menghapus kategori '" +
                kategori.nama_kategori + "'?"
            );

            if (!konfirmasi) return;

            // Periksa apakah kategori masih digunakan oleh produk.
            const { data: produkTerkait, error: errorProduk } =
                await supabaseClient
                    .from("produk")
                    .select("id")
                    .eq("kategori", kategori.nilai_kategori)
                    .limit(1);

            if (errorProduk) {
                console.error("Gagal memeriksa produk:", errorProduk);
                alert("Tidak dapat memeriksa produk. Kategori tidak jadi dihapus.");
                return;
            }

            if (produkTerkait && produkTerkait.length > 0) {
                alert(
                    "Kategori ini masih digunakan oleh produk. " +
                    "Ubah kategori produk tersebut terlebih dahulu."
                );
                return;
            }

            const { error: errorHapus } = await supabaseClient
                .from("kategori_produk")
                .delete()
                .eq("id", kategori.id);

            if (errorHapus) {
                console.error("Gagal menghapus kategori:", errorHapus);
                alert("Gagal menghapus kategori. Periksa izin Supabase.");
                return;
            }

            alert("Kategori berhasil dihapus!");

            await muatDaftarKategoriAdmin();
            await muatKategoriAdmin();
        });

        
tombolEdit.addEventListener("click", async function() {
    const namaBaru = prompt(
        "Masukkan nama baru untuk kategori:",
        kategori.nama_kategori
    );

    if (namaBaru === null) return;

    const namaBersih = namaBaru.trim();

    if (!namaBersih) {
        alert("Nama kategori tidak boleh kosong.");
        return;
    }

    if (namaBersih === kategori.nama_kategori) {
        return;
    }

    const konfirmasi = confirm(
        "Ubah nama kategori '" + kategori.nama_kategori +
        "' menjadi '" + namaBersih + "'?"
    );

    if (!konfirmasi) return;

    const { error } = await supabaseClient
        .from("kategori_produk")
        .update({ nama_kategori: namaBersih })
        .eq("id", kategori.id);

    if (error) {
        console.error("Gagal mengubah kategori:", error);
        alert("Gagal mengubah kategori. Periksa izin Supabase.");
        return;
    }

    alert("Nama kategori berhasil diperbarui!");

    await muatDaftarKategoriAdmin();
    await muatKategoriAdmin();
});


        baris.appendChild(nama);
        baris.appendChild(nilai);
        baris.appendChild(tombolEdit);
        baris.appendChild(tombolHapus);
        daftar.appendChild(baris);
    });

    area.replaceChildren(daftar);
}

    async function simpanKategoriAdmin(event) {
    event.preventDefault();

    const namaInput = document.getElementById("nama-kategori-admin");
    const nilaiInput = document.getElementById("nilai-kategori-admin");
    const pesan = document.getElementById("pesan-kategori-admin");

    const namaKategori = namaInput.value.trim();
    const nilaiKategori = nilaiInput.value.trim().toLowerCase();

    if (!namaKategori || !nilaiKategori) {
        pesan.textContent = "Nama dan nilai kategori wajib diisi.";
        return;
    }

    pesan.textContent = "Menyimpan kategori...";

    const { error } = await supabaseClient
        .from("kategori_produk")
        .insert([{
            nama_kategori: namaKategori,
            nilai_kategori: nilaiKategori
        }]);

    if (error) {
        console.error("Gagal menyimpan kategori:", error);

        if (error.code === "23505") {
            pesan.textContent = "Kategori tersebut sudah ada.";
        } else {
            pesan.textContent = "Gagal menyimpan kategori. Periksa izin Supabase.";
        }

        return;
    }

    pesan.textContent = "Kategori berhasil disimpan!";

    document.getElementById("form-kategori-admin").reset();

    await muatDaftarKategoriAdmin();
}
</script>
