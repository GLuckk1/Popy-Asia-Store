async function logoutAdmin() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Gagal keluar. Silakan coba lagi.");
        return;
    }

    document.querySelector("#konten-admin").style.display = "none";
    document.querySelector("#login-admin").style.display = "block";
}


async function simpanProdukAdmin(event) {
    event.preventDefault();

    const form = document.querySelector("#form-produk-admin");
    const pesan = document.querySelector("#pesan-produk-admin");

    const nama = document.querySelector("#nama-produk-admin").value.trim();
    const kategori = document.querySelector("#kategori-produk-admin").value;
    const harga = Number(document.querySelector("#harga-produk-admin").value);
    const hargaLamaInput = document.querySelector("#harga-lama-admin").value;
    const hargaPromoInput = document.querySelector("#harga-promo-admin").value;
    const deskripsi = document.querySelector("#deskripsi-produk-admin").value.trim();
    const fileFoto = document.querySelector("#gambar-produk-admin").files[0];
    const stok = Number(document.querySelector("#stok-produk-admin").value);
    const aktif = document.querySelector("#aktif-produk-admin").checked;

    const hargaLama = hargaLamaInput === "" ? null : Number(hargaLamaInput);
    const hargaPromo = hargaPromoInput === "" ? null : Number(hargaPromoInput);

    if (!nama || !kategori || !fileFoto || harga < 0 || stok < 0) {
        pesan.textContent = "Lengkapi data produk dan pilih foto.";
        return;
    }

    if (!fileFoto.type.startsWith("image/")) {
        pesan.textContent = "File harus berupa gambar.";
        return;
    }

    if (fileFoto.size > 5 * 1024 * 1024) {
        pesan.textContent = "Ukuran foto maksimal 5 MB.";
        return;
    }

    if (hargaPromo !== null && hargaPromo >= harga) {
        pesan.textContent = "Harga promo harus lebih rendah dari harga normal.";
        return;
    }

    const hargaAcuan = hargaLama !== null && hargaLama > 0
        ? hargaLama
        : harga;

    const promoPersen = hargaPromo !== null && hargaAcuan > hargaPromo
        ? Math.round((hargaAcuan - hargaPromo) / hargaAcuan * 100)
        : 0;

    pesan.textContent = "Sedang mengunggah foto...";

    const ekstensi = fileFoto.name.split(".").pop().toLowerCase();
    const namaFile = `${crypto.randomUUID()}.${ekstensi}`;

    const { data: hasilUpload, error: errorUpload } = await supabaseClient
        .storage
        .from("produk")
        .upload(namaFile, fileFoto, {
            cacheControl: "3600",
            upsert: false
        });

    if (errorUpload) {
        console.error("Gagal upload foto:", errorUpload);
        pesan.textContent = "Upload foto gagal. Periksa izin Storage.";
        return;
    }

    const { data: urlFoto } = supabaseClient
        .storage
        .from("produk")
        .getPublicUrl(hasilUpload.path);

    pesan.textContent = "Foto berhasil diunggah. Menyimpan produk...";

    const { error } = await supabaseClient
        .from("produk")
        .insert([{
            nama_produk: nama,
            kategori: kategori,
            harga: harga,
            harga_lama: hargaLama,
            harga_promo: hargaPromo,
            promo_persen: promoPersen,
            deskripsi: deskripsi,
            gambar_url: urlFoto.publicUrl,
            stok: stok,
            aktif: aktif
        }]);

    if (error) {
        console.error("Gagal menyimpan produk:", error);
        pesan.textContent = "Foto sudah diunggah, tetapi data produk gagal disimpan. Periksa izin database.";
        return;
    }

    pesan.textContent = "Produk dan foto berhasil disimpan!";
    form.reset();
    document.querySelector("#stok-produk-admin").value = "0";
    document.querySelector("#aktif-produk-admin").checked = true;
}

    
async function muatDaftarProdukAdmin() {
    const daftar = document.querySelector("#daftar-produk-admin");
    if (!daftar) return;

    daftar.textContent = "Memuat daftar produk...";

    const { data: produk, error } = await supabaseClient
        .from("produk")
        .select("id, nama_produk, kategori, harga, harga_lama, harga_promo, stok, aktif, gambar_url")
        .order("id", { ascending: false });

    if (error) {
        console.error("Gagal memuat produk:", error);
        daftar.textContent = "Gagal memuat produk. Periksa izin SELECT.";
        return;
    }

    if (!produk || produk.length === 0) {
        daftar.textContent = "Belum ada produk.";
        return;
    }

    daftar.innerHTML = produk.map(item => `
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #ddd;">
            <img
                src="${escapeHTML(item.gambar_url || "")}"
                alt="${escapeHTML(item.nama_produk || "Produk")}"
                style="width:65px;height:65px;object-fit:cover;border-radius:8px;"
            >
            <div style="flex:1;min-width:150px;">
                <strong>${escapeHTML(item.nama_produk || "")}</strong>
                <div>Harga: ¥${Number(item.harga || 0).toLocaleString("ja-JP")}</div>
                <div>Stok: ${Number(item.stok || 0)}</div>
                <div>Status: ${item.aktif ? "Aktif" : "Nonaktif"}</div>
            </div>
            <button type="button" class="btn"
                onclick="editProdukAdmin(${Number(item.id)})">✏️ Edit</button>
            <button type="button" class="btn"
                onclick="hapusProdukAdmin(${Number(item.id)})">🗑️ Hapus</button>
        </div>
    `).join("");
}

    
async function editProdukAdmin(id) {
    const { data: produk, error } = await supabaseClient
        .from("produk")
        .select("*")
        .eq("id", id)
        .single();

    if (error || !produk) {
        alert("Gagal mengambil data produk.");
        console.error(error);
        return;
    }

    // Nama produk
    const nama = prompt(
        "Nama produk:",
        produk.nama_produk || ""
    );
    if (nama === null) return;

    // Kategori
    const kategori = prompt(
        "Kategori produk:",
        produk.kategori || ""
    );
    if (kategori === null) return;

    // Harga normal
    const hargaInput = prompt(
        "Harga normal (¥):",
        produk.harga ?? 0
    );
    if (hargaInput === null) return;

    // Harga promo
    const hargaPromoInput = prompt(
        "Harga promo (¥). Isi 0 jika tidak ada promo:",
        produk.harga_promo ?? 0
    );
    if (hargaPromoInput === null) return;

    // Deskripsi
    const deskripsi = prompt(
        "Deskripsi produk:",
        produk.deskripsi || ""
    );
    if (deskripsi === null) return;

    // Stok
    const stokInput = prompt(
        "Stok produk:",
        produk.stok ?? 0
    );
    if (stokInput === null) return;

    // Status produk
    const statusInput = prompt(
        "Status produk: ketik 1 untuk Aktif atau 0 untuk Nonaktif.",
        produk.aktif ? "1" : "0"
    );
    if (statusInput === null) return;

    // Memeriksa input
    const namaBaru = nama.trim();
    const kategoriBaru = kategori.trim();
    const hargaBaru = Number(hargaInput);
    const hargaPromoBaru = Number(hargaPromoInput);
    const stokBaru = Number(stokInput);
    const statusBaru = statusInput.trim();

    if (
        !namaBaru ||
        !kategoriBaru ||
        hargaInput.trim() === "" ||
        !Number.isFinite(hargaBaru) ||
        hargaBaru < 0 ||
        hargaPromoInput.trim() === "" ||
        !Number.isFinite(hargaPromoBaru) ||
        hargaPromoBaru < 0 ||
        stokInput.trim() === "" ||
        !Number.isInteger(stokBaru) ||
        stokBaru < 0 ||
        !["0", "1"].includes(statusBaru)
    ) {
        alert("Data tidak valid. Silakan periksa kembali.");
        return;
    }

    // Menyimpan perubahan
    const { error: errorUpdate } = await supabaseClient
        .from("produk")
        .update({
            nama_produk: namaBaru,
            kategori: kategoriBaru,
            harga: hargaBaru,
            harga_promo: hargaPromoBaru,
            deskripsi: deskripsi.trim(),
            stok: stokBaru,
            aktif: statusBaru === "1"
        })
        .eq("id", id);

    if (errorUpdate) {
        console.error("Gagal memperbarui produk:", errorUpdate);
        alert("Gagal mengedit produk. Periksa izin Supabase.");
        return;
    }

    alert("Produk berhasil diperbarui!");

    await muatDaftarProdukAdmin();
}

    
async function hapusProdukAdmin(id) {
    const yakin = confirm(
        "Yakin ingin menghapus produk ini? Tindakan ini tidak bisa dibatalkan."
    );

    if (!yakin) return;

    const { error } = await supabaseClient
        .from("produk")
        .delete()
        .eq("id", id);

    if (error) {
        console.error("Gagal menghapus produk:", error);
        alert("Gagal menghapus produk. Periksa izin Supabase.");
        return;
    }

    alert("Produk berhasil dihapus!");

    await muatDaftarProdukAdmin();
}

    
async function muatPesananAdmin() {
    const status = document.querySelector("#status-pesanan");
    const daftar = document.querySelector("#daftar-pesanan");

    status.textContent = "Memuat pesanan...";

    const { data, error } = await supabaseClient
        .from("pesanan")
        .select("nomor_pesanan, subtotal, ongkir, total, status, created_at")
        .order("created_at", { ascending: false });

    if (error) {
        status.textContent = "Gagal memuat pesanan: " + error.message;
        return;
    }

    if (!data || data.length === 0) {
        status.textContent = "Belum ada pesanan.";
        return;
    }

    status.textContent = "Jumlah pesanan: " + data.length;

    daftar.innerHTML = data.map(pesanan => `
        <tr>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(pesanan.nomor_pesanan || "-")}
            </td>
            
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(
                    pesanan.created_at
                        ? new Date(pesanan.created_at).toLocaleString("id-ID")
                        : "-"
                )}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ¥${Number(pesanan.total || 0).toLocaleString("ja-JP")}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(pesanan.status || "-")}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
    <button
        type="button"
        class="btn"
        onclick="lihatDetailPesanan('${escapeHTML(pesanan.nomor_pesanan)}')">
        Lihat Detail
    </button>
</td>
        </tr>
    `).join("");
}

function escapeHTML(nilai) {
    return String(nilai).replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.harga)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${Number(item.jumlah || 0)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.subtotal)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <p style="text-align:right;">Subtotal: ${uang(pesanan.subtotal)}</p>
            <p style="text-align:right;">Ongkir: ${uang(pesanan.ongkir)}</p>
            <h3 style="text-align:right;">Total: ${uang(pesanan.total)}</h3>
        </div>

        <button type="button" class="btn" onclick="cetakNotaPesanan()">
            🖨️ Cetak / Simpan PDF
        </button>
    `;
}

function cetakNotaPesanan() {
    const nota = document.querySelector("#nota-pesanan");

    if (!nota) {
        alert("Nota belum tersedia.");
        return;
    }

    const jendela = window.open("", "_blank");

    if (!jendela) {
        alert("Pop-up diblokir browser. Izinkan pop-up untuk mencetak nota.");
        return;
    }

    jendela.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
            <meta charset="UTF-8">
            <title>Nota Pesanan</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 24px; }
                table { border-collapse: collapse; }
                @media print {
                    body { margin: 0; }
                    button { display: none; }
                }
            </style>
        </head>
        <body>${nota.outerHTML}</body>
        </html>
    `);

    jendela.document.close();
    jendela.focus();
    jendela.print();
}

async function simpanStatusPesanan(nomorPesanan) {
    const pilihan = document.querySelector("#status-pesanan-baru");
    const pesan = document.querySelector("#pesan-status-pesanan");

    if (!pilihan || !pesan) return;

    const statusBaru = pilihan.value;
    pesan.textContent = "Menyimpan status...";

    const { data: pesanan, error: errorCari } = await supabaseClient
        .from("pesanan")
        .select("id")
        .eq("nomor_pesanan", nomorPesanan)
        .single();

    if (errorCari || !pesanan) {
        pesan.textContent = "Gagal menemukan pesanan.";
        return;
    }

    const { error } = await supabaseClient
        .from("pesanan")
        .update({ status: statusBaru })
        .eq("id", pesanan.id);

    if (error) {
        pesan.textContent = "Gagal menyimpan status: " + error.message;
        return;
    }

    pesan.textContent = "Status berhasil disimpan!";

    await lihatDetailPesanan(nomorPesanan);
}
</script>
