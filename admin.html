    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        /* HEADER */

        .header {
            background: #222;
            color: white;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
        }

        .admin-label {
            font-size: 14px;
            opacity: 0.8;
        }


        /* LAYOUT */

        .container {
            display: flex;
            min-height: calc(100vh - 65px);
        }


        /* SIDEBAR */

        .sidebar {
            width: 220px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 20px 0;
        }

        .sidebar button {
            width: 100%;
            padding: 14px 20px;

            border: none;
            background: white;

            text-align: left;
            font-size: 15px;

            cursor: pointer;
        }

        .sidebar button:hover {
            background: #f0f0f0;
        }

        .sidebar button.aktif {
            background: #222;
            color: white;
        }


        /* CONTENT */

        .content {
            flex: 1;
            padding: 25px;
        }

        .content h2 {
            margin-bottom: 20px;
        }


        /* STATISTIK */

        .statistik {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .kartu-statistik {
            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }

        .kartu-statistik h3 {
            font-size: 14px;
            color: #777;

            margin-bottom: 10px;
        }

        .kartu-statistik p {
            font-size: 25px;
            font-weight: bold;
        }


        /* PESANAN */

        .pesanan {
            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.08);
        }

        .pesanan h3 {
            margin-bottom: 15px;
        }

        .pesanan table {
            width: 100%;

            border-collapse: collapse;
        }

        .pesanan th,
        .pesanan td {
            padding: 12px;

            border-bottom:
                1px solid #eee;

            text-align: left;
        }

        .pesanan th {
            background: #f8f8f8;
        }


        /* STATUS */

        .status {
            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            background: #fff3cd;
        }


        /* BUTTON */

        .btn {
            padding: 7px 12px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            background: #222;

            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .login-admin .btn {
    display: inline-block !important;
    background: #222 !important;
    color: white !important;
    padding: 7px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .sidebar {
                width: 170px;
            }

            .statistik {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;

                border-right: none;

                border-bottom:
                    1px solid #ddd;
            }

            .statistik {
                grid-template-columns: 1fr;
            }

            .pesanan {
                overflow-x: auto;
            }

        }

    .header,

        async function tampilkanStatistik() {

    const { data: pesanan, error } = await supabaseClient
        .from("pesanan")
        .select("status");

    if (error) {
        console.error("Gagal mengambil statistik:", error);
        return;
    }

    const totalPesanan = pesanan.length;

    const pesananBaru = pesanan.filter(function(order) {
        return order.status === "Pesanan Baru";
    }).length;

    const diproses = pesanan.filter(function(order) {
        return order.status === "Diproses";
    }).length;

    const selesai = pesanan.filter(function(order) {
        return order.status === "Selesai";
    }).length;

    const kartu = document.querySelectorAll(
        ".kartu-statistik p"
    );

    kartu[0].textContent = pesananBaru;
    kartu[1].textContent = diproses;
    kartu[2].textContent = selesai;
    kartu[3].textContent = totalPesanan;
}

async function cekPesananBaru() {

    const { data: pesanan, error } =
        await supabaseClient
            .from("pesanan")
            .select("nomor_pesanan, status")
            .eq("status", "Pesanan Baru");

    if (error) {

        );

        return;
    }

    console.log(
        "Jumlah pesanan baru:",
        pesanan.length
    );

}

        async function loginAdmin() {

    const email = document.getElementById("admin-email").value;
    const password = document.getElementById("admin-password").value;
    const errorElement = document.getElementById("login-error");

    errorElement.textContent = "";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {

        errorElement.textContent =
            "Login gagal: " + error.message;

        return;
    }

    alert("Login admin berhasil!");

    document.getElementById("login-admin").style.display = "none";
    tampilkanStatistik();
    console.log("Admin berhasil login:", data.user.email);
}

        async function tampilkanDaftarPesanan() {

    const { data: pesanan, error } =
        await supabaseClient
            .from("pesanan")
            .select("*")
            .order("id", {
                ascending: false
            });

    if (error) {

        console.error(
            "Gagal mengambil pesanan:",
            error
        );

        return;
    }


    const daftarPelanggan =
        await Promise.all(

            pesanan.map(
                async function(order) {

                    const { data: pelanggan } =
                        await supabaseClient
                            .from("pelanggan")
                            .select("nama")
                            .eq(
                                "id",
                                order.pelanggan_id
                            )
                            .single();

                    return {
                        order: order,
                        nama: pelanggan
                            ? pelanggan.nama
                            : "-"
                    };

                }
            )

        );


    document.querySelector(
        ".content"
    ).innerHTML = `

        <section class="pesanan">

            <h3>
                📦 Daftar Pesanan
            </h3>

            <table>

                <thead>

                    <tr>

                        <th>No. Pesanan</th>
                        <th>Pelanggan</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Aksi</th>

                    </tr>

                </thead>

                <tbody>

                    ${
                        daftarPelanggan.map(
                            function(data) {

                                const order =
                                    data.order;

                                return `

                                    <tr>

                                        <td>
                                            ${order.nomor_pesanan}
                                        </td>

                                        <td>
                                            ${data.nama}
                                        </td>

                                        <td>
                                            ¥${Number(
                                                order.total
                                            ).toLocaleString(
                                                "ja-JP"
                                            )}
                                        </td>

                                        <td>

                                            <select
                                                class="status"
                                                onchange="ubahStatusPesanan('${order.nomor_pesanan}', this.value)"
                                            >

                                                <option
                                                    value="Pesanan Baru"
                                                    ${
                                                        order.status ===
                                                        "Pesanan Baru"
                                                            ? "selected"
                                                            : ""
                                                    }
                                                >
                                                    🟡 Pesanan Baru
                                                </option>

                                                <option
                                                    value="Diproses"
                                                    ${
                                                        order.status ===
                                                        "Diproses"
                                                            ? "selected"
                                                            : ""
                                                    }
                                                >
                                                    🔵 Diproses
                                                </option>

                                                <option
                                                    value="Selesai"
                                                    ${
                                                        order.status ===
                                                        "Selesai"
                                                            ? "selected"
                                                            : ""
                                                    }
                                                >
                                                    🟢 Selesai
                                                </option>

                                            </select>

                                        </td>

                                        <td>

                                            <button
                                                class="btn"
                                                onclick="lihatPesanan('${order.nomor_pesanan}')"
                                            >
                                                Lihat
                                            </button>

                                        </td>

                                    </tr>

                                `;

                            }
                        ).join("")
                    }

                </tbody>

            </table>

        </section>

    `;

}

async function ubahStatusPesanan(nomorPesanan, statusBaru) {

    const { error } = await supabaseClient
        .from("pesanan")
        .update({
            status: statusBaru
        })
        .eq("nomor_pesanan", nomorPesanan);

    if (error) {
        console.error(
            "Gagal mengubah status:",
            error
        );

        alert(
            "❌ Gagal mengubah status pesanan"
        );

        return;
    }

    alert(
        "✅ Status pesanan berhasil diubah menjadi " +
        statusBaru
    );

    tampilkanStatistik();
}
