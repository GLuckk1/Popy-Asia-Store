<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Popy Asia Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login-admin" style="max-width:400px;margin:80px auto;padding:24px;border:1px solid #ddd;border-radius:12px;">
    <h2>Login Admin Popy Asia Store</h2>

    <form id="form-login-admin">
        <label for="email-admin">Email</label>
        <input
            id="email-admin"
            type="email"
            required
            autocomplete="username"
            style="display:block;width:100%;padding:10px;margin:8px 0 16px;box-sizing:border-box;"
        >

        <label for="password-admin">Password</label>
        <input
            id="password-admin"
            type="password"
            required
            autocomplete="current-password"
            style="display:block;width:100%;padding:10px;margin:8px 0 16px;box-sizing:border-box;"
        >

        <button type="submit" class="btn">Masuk</button>
        <p id="pesan-login-admin" role="status"></p>
    </form>
</div>
<div id="konten-admin" style="display:none;">
    <div class="container" style="max-width:1100px;margin:30px auto;padding:20px;">
    <h1>🛒 Popy Asia Store</h1>
    <h2>Dashboard Admin</h2>

    <p>Selamat datang di panel admin!</p>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin:20px 0;">
        <button type="button" class="btn" onclick="tampilkanMenuAdmin('dashboard')">🏠 Dashboard</button>
        <button type="button" class="btn" onclick="tampilkanMenuAdmin('pesanan')">📦 Pesanan</button>
        <button type="button" class="btn" onclick="tampilkanMenuAdmin('pelanggan')">👥 Pelanggan</button>
        <button type="button" class="btn" onclick="tampilkanMenuAdmin('nota')">📄 Nota</button>
        <button type="button" class="btn" onclick="logoutAdmin()">Keluar</button>
    </div>

    <hr>

    <div id="isi-menu-admin">
        <h2>🏠 Dashboard</h2>
        <p>Dashboard admin berhasil dibuka.</p>
        <p>Pilih menu di atas untuk melanjutkan.</p>
    </div>

    </div>
    
 </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://rsmfdhktujpbbyprailw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_oMPqtBesRyC02GSRAYrHUg_bKOjzoax";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    console.log("Supabase website berhasil terhubung!");
    
const loginAdmin = document.querySelector("#form-login-admin");
const pesanLoginAdmin = document.querySelector("#pesan-login-admin");

loginAdmin.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.querySelector("#email-admin").value.trim();
    const password = document.querySelector("#password-admin").value;

    pesanLoginAdmin.textContent = "Sedang memeriksa akun...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        pesanLoginAdmin.textContent = "Login gagal. Periksa email dan password.";
        return;
    }

 pesanLoginAdmin.textContent = "Login berhasil!";

document.querySelector("#login-admin").style.display = "none";
document.querySelector("#konten-admin").style.display = "block";

console.log("Admin berhasil login:", data.user.id);
});

    
function tampilkanMenuAdmin(menu) {
    const isi = document.querySelector("#isi-menu-admin");

    if (menu === "dashboard") {
        isi.innerHTML = `
            <h2>🏠 Dashboard</h2>
            <p>Selamat datang di Popy Asia Store.</p>
        `;

    } else if (menu === "pesanan") {
        isi.innerHTML = `
            <h2>📦 Daftar Pesanan</h2>
            <p id="status-pesanan">Memuat pesanan...</p>
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="padding:10px;border-bottom:1px solid #ddd;">Nomor Pesanan</th>
                            <th style="padding:10px;border-bottom:1px solid #ddd;">Tanggal</th>
                            <th style="padding:10px;border-bottom:1px solid #ddd;">Total</th>
                            <th style="padding:10px;border-bottom:1px solid #ddd;">Status</th>
                            <th style="padding:10px;border-bottom:1px solid #ddd;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="daftar-pesanan"></tbody>
                </table>
            </div>
        `;

        muatPesananAdmin();

    } else if (menu === "pelanggan") {
        isi.innerHTML = `
            <h2>👥 Pelanggan</h2>
            <p>Menu pelanggan siap dibuat.</p>
        `;

    } else if (menu === "nota") {
        isi.innerHTML = `
            <h2>📄 Nota</h2>
            <p>Menu nota siap dibuat.</p>
        `;
    }
}

async function logoutAdmin() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Gagal keluar. Silakan coba lagi.");
        return;
    }

    document.querySelector("#konten-admin").style.display = "none";
    document.querySelector("#login-admin").style.display = "block";
}
    
async function muatPesananAdmin() {
    const status = document.querySelector("#status-pesanan");
    const daftar = document.querySelector("#daftar-pesanan");

    status.textContent = "Memuat pesanan...";

    const { data, error } = await supabaseClient
        .from("pesanan")
        .select("nomor_pesanan, subtotal, ongkir, total, status, created_at")
        .order("created_at", { ascending: false });

    if (error) {
        status.textContent = "Gagal memuat pesanan: " + error.message;
        return;
    }

    if (!data || data.length === 0) {
        status.textContent = "Belum ada pesanan.";
        return;
    }

    status.textContent = "Jumlah pesanan: " + data.length;

    daftar.innerHTML = data.map(pesanan => `
        <tr>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(pesanan.nomor_pesanan || "-")}
            </td>
            
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(
                    pesanan.created_at
                        ? new Date(pesanan.created_at).toLocaleString("id-ID")
                        : "-"
                )}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ¥${Number(pesanan.total || 0).toLocaleString("ja-JP")}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
                ${escapeHTML(pesanan.status || "-")}
            </td>
            <td style="padding:10px;border-bottom:1px solid #ddd;">
    <button
        type="button"
        class="btn"
        onclick="lihatDetailPesanan('${escapeHTML(pesanan.nomor_pesanan)}')">
        Lihat Detail
    </button>
</td>
        </tr>
    `).join("");
}

function escapeHTML(nilai) {
    return String(nilai).replace(/[&<>"']/g, karakter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[karakter]);
}

    
async function lihatDetailPesanan(nomorPesanan) {
    const isi = document.querySelector("#isi-menu-admin");

    isi.innerHTML = `
        <h2>📄 Detail Pesanan ${escapeHTML(nomorPesanan)}</h2>
        <p id="status-detail">Memuat detail pesanan...</p>
        <div id="konten-detail"></div>
        <button type="button" class="btn" onclick="tampilkanMenuAdmin('pesanan')">
            ← Kembali ke Pesanan
        </button>
    `;

    const status = document.querySelector("#status-detail");
    const konten = document.querySelector("#konten-detail");

    const { data: pesanan, error: errorPesanan } = await supabaseClient
        .from("pesanan")
        .select("id, nomor_pesanan, subtotal, ongkir, total, status, created_at, pelanggan_id")
        .eq("nomor_pesanan", nomorPesanan)
        .single();

    if (errorPesanan || !pesanan) {
        status.textContent = "Gagal memuat pesanan: " +
            (errorPesanan?.message || "Pesanan tidak ditemukan.");
        return;
    }

    const { data: produk, error: errorProduk } = await supabaseClient
        .from("detail_pesanan")
        .select("nama_produk, harga, jumlah, subtotal")
        .eq("pesanan_id", pesanan.id);

    if (errorProduk) {
        status.textContent = "Gagal memuat produk: " + errorProduk.message;
        return;
    }

    const { data: pelanggan, error: errorPelanggan } = await supabaseClient
        .from("pelanggan")
        .select("nama, whatsapp, alamat")
        .eq("id", pesanan.pelanggan_id)
        .maybeSingle();

    status.textContent = "";

    const aman = escapeHTML;
    const uang = nilai => "¥" + Number(nilai || 0).toLocaleString("ja-JP");

    konten.innerHTML = `
        <div id="nota-pesanan" style="background:white;color:black;padding:24px;max-width:800px;">
            <h2>Popy Asia Store</h2>
            <h3>NOTA PESANAN</h3>
            <p>Nomor: ${aman(pesanan.nomor_pesanan)}</p>
            <p>Tanggal: ${aman(new Date(pesanan.created_at).toLocaleString("id-ID"))}</p>
            <p>
    Status:
    <strong>${aman(pesanan.status || "-")}</strong>
</p>

<label for="status-pesanan-baru">Ubah Status:</label>

<select id="status-pesanan-baru"
    style="padding:8px;margin:8px 0;">
    <option value="Menunggu">Menunggu</option>
    <option value="Diproses">Diproses</option>
    <option value="Selesai">Selesai</option>
    <option value="Dibatalkan">Dibatalkan</option>
</select>

<button type="button" class="btn"
    onclick="simpanStatusPesanan('${aman(pesanan.nomor_pesanan)}')">
    Simpan Status
</button>

<p id="pesan-status-pesanan"></p>

            <hr>

            <h3>Data Pelanggan</h3>
            <p>Nama: ${aman(pelanggan?.nama || "-")}</p>
            <p>WhatsApp: ${aman(pelanggan?.whatsapp || "-")}</p>
            <p>Alamat: ${aman(pelanggan?.alamat || "-")}</p>

            <hr>

            <h3>Daftar Produk</h3>
            <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th style="text-align:left;padding:8px;border-bottom:1px solid #ccc;">Produk</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Harga</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Jumlah</th>
                            <th style="text-align:right;padding:8px;border-bottom:1px solid #ccc;">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${(produk || []).map(item => `
                            <tr>
                                <td style="padding:8px;border-bottom:1px solid #eee;">${aman(item.nama_produk)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.harga)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${Number(item.jumlah || 0)}</td>
                                <td style="text-align:right;padding:8px;border-bottom:1px solid #eee;">${uang(item.subtotal)}</td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            </div>

            <p style="text-align:right;">Subtotal: ${uang(pesanan.subtotal)}</p>
            <p style="text-align:right;">Ongkir: ${uang(pesanan.ongkir)}</p>
            <h3 style="text-align:right;">Total: ${uang(pesanan.total)}</h3>
        </div>

        <button type="button" class="btn" onclick="cetakNotaPesanan()">
            🖨️ Cetak / Simpan PDF
        </button>
    `;
}

function cetakNotaPesanan() {
    const nota = document.querySelector("#nota-pesanan");

    if (!nota) {
        alert("Nota belum tersedia.");
        return;
    }

    const jendela = window.open("", "_blank");

    if (!jendela) {
        alert("Pop-up diblokir browser. Izinkan pop-up untuk mencetak nota.");
        return;
    }

    jendela.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
            <meta charset="UTF-8">
            <title>Nota Pesanan</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 24px; }
                table { border-collapse: collapse; }
                @media print {
                    body { margin: 0; }
                    button { display: none; }
                }
            </style>
        </head>
        <body>${nota.outerHTML}</body>
        </html>
    `);

    jendela.document.close();
    jendela.focus();
    jendela.print();
}

async function simpanStatusPesanan(nomorPesanan) {
    const pilihan = document.querySelector("#status-pesanan-baru");
    const pesan = document.querySelector("#pesan-status-pesanan");

    if (!pilihan || !pesan) return;

    const statusBaru = pilihan.value;
    pesan.textContent = "Menyimpan status...";

    const { data: pesanan, error: errorCari } = await supabaseClient
        .from("pesanan")
        .select("id")
        .eq("nomor_pesanan", nomorPesanan)
        .single();

    if (errorCari || !pesanan) {
        pesan.textContent = "Gagal menemukan pesanan.";
        return;
    }

    const { error } = await supabaseClient
        .from("pesanan")
        .update({ status: statusBaru })
        .eq("id", pesanan.id);

    if (error) {
        pesan.textContent = "Gagal menyimpan status: " + error.message;
        return;
    }

    pesan.textContent = "Status berhasil disimpan!";

    await lihatDetailPesanan(nomorPesanan);
}
</script>

</body>
</html>
